<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>เดี๋ยวเลากินเอง 🥑</title>
    <!-- iOS Web App Support (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="เดี๋ยวเลากินเอง">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/avocado-emoji.png">
    
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Donut Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-24 font-sans antialiased selection:bg-orange-500">

    <!-- Header Bar -->
    <header class="sticky top-0 bg-slate-900/80 backdrop-blur-md z-50 border-b border-slate-800 p-4 text-center">
        <h1 class="text-xl font-bold text-orange-400">เดี๋ยวเลากินเอง 🥑</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Tab 1: Calorie Tracker -->
        <section id="tab-tracker" class="tab-content space-y-6">
            <!-- Calorie Overview Chart -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center relative">
                <div class="w-48 h-48 mx-auto relative flex items-center justify-center">
                    <canvas id="macroChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span id="remainingCal" class="text-3xl font-extrabold text-orange-400">2000</span>
                        <span class="text-xs text-slate-400">แคลอรี่คงเหลือ (kcal)</span>
                    </div>
                </div>
                
                <!-- Macros Summary -->
                <div class="grid grid-cols-3 gap-2 mt-4 text-sm">
                    <div class="bg-slate-900/60 p-2 rounded-xl border border-red-500/30">
                        <div class="text-red-400 font-medium text-xs">โปรตีน</div>
                        <div id="totalProtein" class="font-bold text-base">0g</div>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-xl border border-blue-500/30">
                        <div class="text-blue-400 font-medium text-xs">คาร์บ</div>
                        <div id="totalCarbs" class="font-bold text-base">0g</div>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-xl border border-yellow-500/30">
                        <div class="text-yellow-400 font-medium text-xs">ไขมัน</div>
                        <div id="totalFat" class="font-bold text-base">0g</div>
                    </div>
                </div>
            </div>

            <!-- Water Intake Section -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-bold text-blue-400 flex items-center gap-1">💧 ติดตามการดื่มน้ำ</span>
                    <span id="waterText" class="text-slate-300 font-semibold">0 / 2000 ml</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden">
                    <div id="waterBar" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="addWater(45)" class="flex-1 bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 py-2 rounded-xl font-bold text-sm border border-blue-500/30">
                        +45 ml 💧
                    </button>
                    <button onclick="addWater(-45)" class="flex-1 bg-slate-700 text-slate-300 hover:bg-slate-600 py-2 rounded-xl font-medium text-sm">
                        -45 ml
                    </button>
                </div>
            </div>

            <!-- Food Add Form -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h2 class="font-bold text-slate-200">➕ บันทึกอาหาร</h2>
                <input type="text" id="foodName" placeholder="ชื่ออาหาร (เช่น ข้าวมันไก่)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-orange-500">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="foodCal" placeholder="แคลอรี่ (kcal)" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-orange-500">
                    <input type="number" id="foodProtein" placeholder="โปรตีน (g)" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="foodCarbs" placeholder="คาร์บ (g)" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-orange-500">
                    <input type="number" id="foodFat" placeholder="ไขมัน (g)" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <button onclick="addFood()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                    บันทึกรายการอาหาร
                </button>
            </div>

            <!-- Today Food List -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h2 class="font-bold text-slate-200">🍽️ อาหารวันนี้</h2>
                <div id="todayList" class="space-y-2 divide-y divide-slate-700">
                    <!-- Dynamic List -->
                </div>
            </div>
        </section>

        <!-- Tab 2: Settings & TDEE Calculator -->
        <section id="tab-settings" class="tab-content hidden space-y-6">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
                <h2 class="font-bold text-orange-400 text-lg">⚙️ ตั้งค่าเป้าหมาย TDEE</h2>
                
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-slate-400 mb-1">เพศ</label>
                        <select id="calcGender" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5">
                            <option value="male">ชาย</option>
                            <option value="female">หญิง</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-slate-400 mb-1">น้ำหนัก (kg)</label>
                            <input type="number" id="calcWeight" value="65" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">ส่วนสูง (cm)</label>
                            <input type="number" id="calcHeight" value="170" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">อายุ (ปี)</label>
                            <input type="number" id="calcAge" value="25" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">ระดับกิจกรรม</label>
                        <select id="calcActivity" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5">
                            <option value="1.2">นั่งทำงานอยู่กับที่</option>
                            <option value="1.375" selected>ออกกำลังกาย 1-3 วัน/สัปดาห์</option>
                            <option value="1.55">ออกกำลังกาย 3-5 วัน/สัปดาห์</option>
                            <option value="1.725">ออกกำลังกาย 6-7 วัน/สัปดาห์</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">BMR:</span>
                        <span id="resBMR" class="font-bold">0 kcal</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">TDEE:</span>
                        <span id="resTDEE" class="font-bold text-orange-400">0 kcal</span>
                    </div>
                </div>

                <button onclick="saveTDEEGoal()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all">
                    บันทึกเป็นเป้าหมายประจำวัน 🎯
                </button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 p-3 flex justify-around text-xs">
        <button onclick="switchTab('tracker')" id="nav-tracker" class="flex flex-col items-center gap-1 text-orange-400 font-bold">
            <span class="text-lg">🥑</span>
            <span>นับแคล</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-lg">⚙️</span>
            <span>ตั้งค่า TDEE</span>
        </button>
    </nav>

    <!-- JavaScript Application Logic -->
    <script>
        let state = {
            dailyGoal: parseInt(localStorage.getItem('saved_dailyGoal')) || 2000,
            waterIntake: parseInt(localStorage.getItem('saved_waterIntake')) || 0,
            waterGoal: 2000,
            foodEntries: JSON.parse(localStorage.getItem('saved_foodEntries')) || []
        };

        let chart;

        function initChart() {
            const ctx = document.getElementById('macroChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['โปรตีน', 'คาร์บ', 'ไขมัน'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#ef4444', '#3b82f6', '#eab308'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '75%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateUI() {
            const today = new Date().toDateString();
            const todayEntries = state.foodEntries.filter(e => new Date(e.date).toDateString() === today);
            
            const totalCal = todayEntries.reduce((a, b) => a + b.calories, 0);
            const totalP = todayEntries.reduce((a, b) => a + b.protein, 0);
            const totalC = todayEntries.reduce((a, b) => a + b.carbs, 0);
            const totalF = todayEntries.reduce((a, b) => a + b.fat, 0);

            const remaining = state.dailyGoal - totalCal;
            document.getElementById('remainingCal').innerText = remaining;
            document.getElementById('totalProtein').innerText = totalP + 'g';
            document.getElementById('totalCarbs').innerText = totalC + 'g';
            document.getElementById('totalFat').innerText = totalF + 'g';

            // Chart Update
            if (chart) {
                chart.data.datasets[0].data = [totalP || 1, totalC || 1, totalF || 1];
                chart.update();
            }

            // Water Update
            document.getElementById('waterText').innerText = `${state.waterIntake} / ${state.waterGoal} ml`;
            const waterPercent = Math.min(100, (state.waterIntake / state.waterGoal) * 100);
            document.getElementById('waterBar').style.width = waterPercent + '%';

            // Today List Update
            const listEl = document.getElementById('todayList');
            if (todayEntries.length === 0) {
                listEl.innerHTML = `<div class="text-slate-500 text-xs italic text-center py-2">ยังไม่มีรายการอาหารวันนี้</div>`;
            } else {
                listEl.innerHTML = todayEntries.map(e => `
                    <div class="flex justify-between items-center pt-2">
                        <div>
                            <div class="font-bold text-sm text-slate-200">${e.name}</div>
                            <div class="text-xs text-slate-400">P:${e.protein}g | C:${e.carbs}g | F:${e.fat}g</div>
                        </div>
                        <div class="font-bold text-orange-400 text-sm">${e.calories} kcal</div>
                    </div>
                `).join('');
            }

            calculateBMR();
        }

        function addFood() {
            const name = document.getElementById('foodName').value;
            const cal = parseInt(document.getElementById('foodCal').value);
            const p = parseFloat(document.getElementById('foodProtein').value) || 0;
            const c = parseFloat(document.getElementById('foodCarbs').value) || 0;
            const f = parseFloat(document.getElementById('foodFat').value) || 0;

            if (!name || !cal) return alert('กรุณากรอกชื่ออาหารและแคลอรี่');

            state.foodEntries.push({ name, calories: cal, protein: p, carbs: c, fat: f, date: new Date() });
            localStorage.setItem('saved_foodEntries', JSON.stringify(state.foodEntries));

            document.getElementById('foodName').value = '';
            document.getElementById('foodCal').value = '';
            document.getElementById('foodProtein').value = '';
            document.getElementById('foodCarbs').value = '';
            document.getElementById('foodFat').value = '';

            updateUI();
        }

        function addWater(amount) {
            state.waterIntake = Math.max(0, state.waterIntake + amount);
            localStorage.setItem('saved_waterIntake', state.waterIntake);
            updateUI();
        }

        function calculateBMR() {
            const gender = document.getElementById('calcGender').value;
            const w = parseFloat(document.getElementById('calcWeight').value) || 0;
            const h = parseFloat(document.getElementById('calcHeight').value) || 0;
            const a = parseFloat(document.getElementById('calcAge').value) || 0;
            const act = parseFloat(document.getElementById('calcActivity').value);

            let bmr = (10 * w) + (6.25 * h) - (5 * a);
            bmr = gender === 'male' ? bmr + 5 : bmr - 161;
            const tdee = bmr * act;

            document.getElementById('resBMR').innerText = Math.round(bmr) + ' kcal';
            document.getElementById('resTDEE').innerText = Math.round(tdee) + ' kcal';
            return Math.round(tdee);
        }

        function saveTDEEGoal() {
            const tdee = calculateBMR();
            state.dailyGoal = tdee;
            localStorage.setItem('saved_dailyGoal', tdee);
            alert(`บันทึกเป้าหมาย ${tdee} kcal เรียบร้อยแล้ว!`);
            switchTab('tracker');
            updateUI();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');

            document.getElementById('nav-tracker').className = tab === 'tracker' ? 'flex flex-col items-center gap-1 text-orange-400 font-bold' : 'flex flex-col items-center gap-1 text-slate-400';
            document.getElementById('nav-settings').className = tab === 'settings' ? 'flex flex-col items-center gap-1 text-orange-400 font-bold' : 'flex flex-col items-center gap-1 text-slate-400';
        }

        // Add Event Listeners for inputs
        ['calcGender', 'calcWeight', 'calcHeight', 'calcAge', 'calcActivity'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateBMR);
        });

        window.onload = () => {
            initChart();
            updateUI();
        };
    </script>
</body>
</html>
